services:
  isaac-sim:
    build:
      context: .
      dockerfile: Dockerfile
    # Using a variable for the name allows multiple instances
    container_name: ${CONTAINER_NAME:-isaac_container}
    image: local/ubuntu-desktop-vnc:isaac-5.1
    
    runtime: nvidia
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, video, compute, utility]
    
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb
    
    ports:
      - "${HTTP_PORT:-8080}:80"      
      - "${VNC_PORT:-9090}:5900"    
    
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-isaac_sim}
      - DISPLAY=:0
      - RESOLUTION=1920x1080
      - ALSADEV=hw:2,0
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - CUDA_VISIBLE_DEVICES=0 
      - OMNI_KIT_ALLOW_ROOT=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all      
    
    volumes:
      # SHARED: Read-only suggested to prevent one user from breaking the base install
      - /mount/Data2/saswata/isaac_sim_storage/isaacsim:/root/isaacsim:ro
      - /mount/Data2/saswata/isaac_sim_storage/isaacsim_assets:/root/isaacsim_assets:ro
      
      # UNIQUE: Each user MUST have their own data/config folder
      - ${HOST_USER_DATA}:/root/.nvidia-omniverse:rw
      
      # UNIQUE: Each user's personal workspace
      - ${HOST_WORKSPACE}:/workspace
      
      # SYSTEM: Standard sockets
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    mem_limit: 120g
    cpus: '112.0'
    shm_size: '8gb'
    
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  desktop-net:
    # Use a unique network name if running across different project scopes
    name: ${USER_NAME:-default}_net
    driver: bridge
