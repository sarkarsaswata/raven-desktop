[project]
name = "isaac-lab-user-project"
version = "0.1.0"
description = "User project for Isaac Lab with PyTorch"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "tensorboard>=2.14.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
]

# PyTorch index configuration for CUDA 12.8
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]
