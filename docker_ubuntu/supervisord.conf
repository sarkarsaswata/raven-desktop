# ============================================================================
# Supervisor Configuration: Desktop Environment Process Management
# ============================================================================
# Description:
#   Supervisor manages all long-running desktop services including:
#   - X11 display server (Xvfb)
#   - Window manager and desktop components (Openbox, LXPanel, PCManFM)
#   - VNC server for remote access
#   - WebSocket VNC bridge
#   - HTTP reverse proxy
#
# Documentation: http://supervisord.org/
# ============================================================================

[supervisord]
# Run in foreground to keep container alive
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ============================================================================
# Service Definitions
# ============================================================================

# -------------------------------------------------
# [PRIORITY 10] Xvfb - Virtual Framebuffer
# -------------------------------------------------
# Creates a virtual X11 display server (renders to memory, not a monitor).
# WIDTH and HEIGHT are exported by startup.sh from the RESOLUTION env var.
[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_WIDTH)sx%(ENV_HEIGHT)sx24
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.out.log
stderr_logfile=/var/log/supervisor/xvfb.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 20] Openbox - Window Manager
# -------------------------------------------------
# Manages window layout, decorations, and user interactions.
[program:openbox]
command=/bin/bash -c "sleep 1 && /usr/bin/openbox"
environment=DISPLAY=":0"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/openbox.out.log
stderr_logfile=/var/log/supervisor/openbox.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 21] xcompmgr - Compositor (fixes ghosting)
# -------------------------------------------------
# Manages window transparency and buffers screen updates.
# Prevents window trails and ghosting in noVNC.
[program:xcompmgr]
command=/usr/bin/xcompmgr -n
environment=DISPLAY=":0"
priority=21
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xcompmgr.out.log
stderr_logfile=/var/log/supervisor/xcompmgr.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 22] LXPanel - Taskbar and Application Menu
# -------------------------------------------------
# Provides the taskbar, system tray, and application launcher menu.
[program:lxpanel]
command=/bin/bash -c "sleep 2 && /usr/bin/lxpanel --profile LXDE"
environment=DISPLAY=":0"
priority=22
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/lxpanel.out.log
stderr_logfile=/var/log/supervisor/lxpanel.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 23] PCManFM - File Manager and Desktop
# -------------------------------------------------
# Manages the desktop (wallpaper, icons) and provides file browsing.
[program:pcmanfm]
command=/bin/bash -c "sleep 2.5 && /usr/bin/pcmanfm --desktop --profile LXDE"
environment=DISPLAY=":0"
priority=23
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/pcmanfm.out.log
stderr_logfile=/var/log/supervisor/pcmanfm.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 30] x11vnc - VNC Server
# -------------------------------------------------
# Exposes the X11 display over the VNC protocol on port 5900.
#
# Flags:
#   -rfbauth: password file (written by startup.sh)
#   -forever: keep accepting connections after client disconnects
#   -shared:  allow multiple simultaneous connections
#   -repeat:  enable keyboard repeat
#   -noxrecord/-noxfixes/-noxdamage: reliability and performance flags
[program:x11vnc]
command=/bin/bash -c "sleep 3 && /usr/bin/x11vnc -display :0 -rfbauth /root/.vnc/passwd -forever -shared -rfbport 5900 -repeat -noxrecord -noxfixes -noxdamage -cursor most -cursorpos -nowf"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.out.log
stderr_logfile=/var/log/supervisor/x11vnc.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 31] Autocutsel - Clipboard Synchronization
# -------------------------------------------------
# Synchronizes clipboard between X11 PRIMARY and CLIPBOARD selections.
# Enables copy-paste to work properly in noVNC browser interface.
[program:autocutsel]
command=/bin/bash -c "sleep 3 && /usr/bin/autocutsel -fork && /usr/bin/autocutsel -selection PRIMARY -fork && tail -f /dev/null"
environment=DISPLAY=":0"
priority=31
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/autocutsel.out.log
stderr_logfile=/var/log/supervisor/autocutsel.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 40] Websockify - VNC over WebSocket
# -------------------------------------------------
# Bridges VNC protocol to WebSocket, enabling browser-based access via noVNC.
#   --web=/opt/novnc: serve the noVNC web interface
#   6080: WebSocket listening port
#   localhost:5900: target x11vnc server
[program:websockify]
command=/usr/local/bin/websockify --web=/opt/novnc 6080 localhost:5900
priority=40
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/websockify.out.log
stderr_logfile=/var/log/supervisor/websockify.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# -------------------------------------------------
# [PRIORITY 50] Nginx - HTTP Reverse Proxy
# -------------------------------------------------
# Provides HTTP access on port 80 to the WebSocket noVNC service.
# Allows browser access at http://localhost instead of :6080.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

# ============================================================================
# Service Startup Order (by priority):
#   10 Xvfb    - virtual display must exist first
#   20 Openbox - window manager
#   21 xcompmgr - compositor
#   22 LXPanel  - taskbar
#   23 PCManFM  - file manager and desktop
#   30 x11vnc   - VNC server (needs display ready)
#   31 autocutsel - clipboard sync
#   40 websockify - WebSocket bridge (needs x11vnc ready)
#   50 nginx    - HTTP proxy
#
# Logs: /var/log/supervisor/<service>.{out,err}.log
# ============================================================================
